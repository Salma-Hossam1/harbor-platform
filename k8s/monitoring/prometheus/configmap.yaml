apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: event-gateway
        metrics_path: /metrics
        static_configs:
          - targets:
              - event-gateway.artifact-platform.svc.cluster.local:8080

      - job_name: metadata-worker
        metrics_path: /metrics
        static_configs:
          - targets:
              - metadata-worker.artifact-platform.svc.cluster.local:2112

      - job_name: metadata-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - metadata-api.artifact-platform.svc.cluster.local:8081

      - job_name: "kube-state-metrics"
        static_configs:
          - targets:
              - kube-state-metrics.artifact-platform.svc.cluster.local:8080

      - job_name: "node-exporter"
        static_configs:
          - targets:
              - node-exporter.artifact-platform.svc.cluster.local:9100

      - job_name: postgres
        static_configs:
          - targets:
              - postgres-exporter.artifact-platform.svc.cluster.local:9187

      - job_name: redis
        static_configs:
          - targets:
              - redis-exporter.artifact-platform.svc.cluster.local:9121

      - job_name: "kafka"
        static_configs:
          - targets:
              - kafka-exporter.artifact-platform.svc.cluster.local:9308
