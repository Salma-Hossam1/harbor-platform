apiVersion: apps/v1
kind: Deployment

metadata:
  name: tempo
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo

          image: grafana/tempo:2.8.1
          imagePullPolicy: IfNotPresent

          args:
            - "-config.file=/etc/tempo/tempo.yaml"

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318
              
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/tempo

            - name: data
              mountPath: /var/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
