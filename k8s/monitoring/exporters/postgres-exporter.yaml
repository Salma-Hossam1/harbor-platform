apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: artifact-platform
  labels:
    app: postgres-exporter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent

          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://metadata:metadatapass@postgres:5432/metadata?sslmode=disable"

          ports:
            - name: metrics
              containerPort: 9187