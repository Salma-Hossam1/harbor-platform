apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: artifact-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          imagePullPolicy: IfNotPresent

          args:
            - "--kafka.server=kafka-0.kafka-headless:9092"

          ports:
            - name: metrics
              containerPort: 9308