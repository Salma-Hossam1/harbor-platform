apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring

spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      serviceAccountName: promtail

      containers:
        - name: promtail
          image: grafana/promtail:3.5.4
          imagePullPolicy: IfNotPresent

          args:
            - "-config.file=/etc/promtail/promtail.yaml"

          ports:
            - name: http
              containerPort: 9080

          volumeMounts:
            - mountPath: /etc/promtail
              name: config

            - mountPath: /var/log/containers
              name: varlogcontainers
              readOnly: true

            - mountPath: /var/log/pods
              name: varlogpods
              readOnly: true

            - mountPath: /var/lib/docker/containers
              name: dockercontainers
              readOnly: true

            - mountPath: /run/promtail
              name: positions


      volumes:
        - configMap:
            name: promtail-config
          name: config

        - hostPath:
            path: /var/log/containers
            type: Directory
          name: varlogcontainers

        - hostPath:
            path: /var/log/pods
            type: Directory
          name: varlogpods

        - hostPath:
            path: /var/lib/docker/containers
            type: Directory
          name: dockercontainers

        - emptyDir: {}
          name: positions
