apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.4
          imagePullPolicy: IfNotPresent

          args:
            - "-config.file=/etc/loki/loki-config.yml"

          ports:
            - name: http
              containerPort: 3100

          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yml
              subPath: loki-config.yml
              readOnly: true

            - name: storage
              mountPath: /loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: storage
          persistentVolumeClaim:
            claimName: loki-pvc