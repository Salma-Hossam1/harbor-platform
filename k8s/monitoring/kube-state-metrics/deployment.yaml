apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: artifact-platform
  labels:
    app: kube-state-metrics

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-state-metrics

  template:
    metadata:
      labels:
        app: kube-state-metrics

    spec:
      serviceAccountName: kube-state-metrics

      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 8080

            - name: telemetry
              containerPort: 8081

