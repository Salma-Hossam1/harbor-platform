apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-signer
  namespace: artifact-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-signer
  template:
    metadata:
      labels:
        app: image-signer
    spec:
      containers:
        - name: image-signer
          image: image-signer:dev
          imagePullPolicy: Never

          env:
            - name: KAFKA_BROKERS
              value: "kafka-headless:9092"

            - name: KAFKA_TOPIC
              value: "harbor-events"

            - name: KAFKA_GROUP_ID
              value: "image-signer"

            - name: HARBOR_REGISTRY
              value: "harbor.local"

            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: image-signer-secrets
                  key: harbor-username

            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: image-signer-secrets
                  key: harbor-password

            - name: COSIGN_BINARY
              value: "/usr/local/bin/cosign"

            - name: COSIGN_PRIVATE_KEY
              value: "/etc/cosign/cosign.key"

            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: image-signer-secrets
                  key: cosign-password

            - name: COSIGN_ALLOW_HTTP
              value: "false"

            - name: COSIGN_ALLOW_INSECURE_REGISTRY
              value: "false"

            - name: COSIGN_INSECURE_IGNORE_TLOG
              value: "true"

          volumeMounts:
            - name: cosign-private-key
              mountPath: /etc/cosign
              readOnly: true

            - name: harbor-ca
              mountPath: /etc/harbor-ca
              readOnly: true

      volumes:
        - name: cosign-private-key
          secret:
            secretName: image-signer-secrets
            items:
              - key: cosign.key
                path: cosign.key

        - name: harbor-ca
          configMap:
            name: harbor-ca
