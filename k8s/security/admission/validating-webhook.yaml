apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: artifact-platform-admission
webhooks:
  - name: admission.artifact-platform.local
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail

    clientConfig:
      caBundle: 
      service:
        name: admission-webhook
        namespace: artifact-platform
        path: /validate
        port: 443

    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

    namespaceSelector:
      matchLabels:
        artifact-platform-admission: enabled
