services:
  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: platform-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - platform

  grafana:
    image: grafana/grafana:12.1.1

    container_name: platform-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - platform

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1

    container_name: platform-postgres-exporter

    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://metadata:metadatapass@postgres:5432/metadata?sslmode=disable"

    networks:
      - platform

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0

    container_name: platform-redis-exporter

    restart: unless-stopped

    environment:
      REDIS_ADDR: redis://redis:6379

    networks:
      - platform

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0

    container_name: platform-kafka-exporter

    restart: unless-stopped

    command:
      - --kafka.server=kafka:9092

    networks:
      - platform

  loki:
    image: grafana/loki:3.5.4

    container_name: platform-loki

    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/config.yml"

    volumes:
      - ../monitoring/Loki/loki-config.yml:/etc/loki/config.yml

    networks:
      - platform

  promtail:
    image: grafana/promtail:3.5.4

    container_name: platform-promtail

    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ../monitoring/Loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "9080:9080"

    depends_on:
      - loki

    networks:
      - platform
      

  tempo:
    image: grafana/tempo:2.8.1

    container_name: platform-tempo

    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo.yaml
      - tempo_data:/var/tempo

    ports:
      - "3200:3200"

    networks:
      - platform

  otel-collector:
    image: otel/opentelemetry-collector:0.132.0

    container_name: platform-otel-collector

    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ../monitoring/openTelemetry/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

    depends_on:
      - tempo

    networks:
      - platform

networks:
  platform:
    external: true

volumes:
  grafana_data:   
  tempo_data: