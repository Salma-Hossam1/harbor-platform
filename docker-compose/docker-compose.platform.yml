services:
  event-gateway:
    build:
      context: ../services/event-gateway
      dockerfile: Dockerfile
    container_name: platform-event-gateway
    ports:
      - "8080:8080"
    env_file:
      - ../config/platform/event-gateway.env

    networks:
      - platform

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    depends_on:
      kafka:
        condition: service_started

  metadata-worker:
    build:
      context: ../services/metadata-worker
      dockerfile: Dockerfile

    container_name: platform-metadata-worker

    env_file:
      - ../config/metadata/worker.env

    restart: unless-stopped

    ports:
      - "2112:2112"
    depends_on:
      kafka:
        condition: service_started

    networks:
      - platform

  metadata-api:
    build:
      context: ../services/metadata-api
      dockerfile: Dockerfile

    container_name: platform-metadata-api

    env_file:
      - ../config/metadata/api.env

    ports:
      - "8081:8081"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - platform

networks:
  platform:
    external: true
